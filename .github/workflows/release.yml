name: Release ClipSync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run core unit tests
        run: cargo test -p clipsync_core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: relay/package-lock.json
      - name: Typecheck Cloudflare relay
        working-directory: relay
        run: npm ci && npm run typecheck

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows tray executable
        run: cargo build --release -p clipsync_windows --bin clipsync --target x86_64-pc-windows-msvc
      - name: Package Windows artifact
        shell: bash
        run: cp target/x86_64-pc-windows-msvc/release/clipsync.exe ClipSync-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClipSync-windows-x64
          path: ClipSync-windows-x64.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS universal DMG
        run: |
          chmod +x desktop/macos/build_dmg.sh
          ./desktop/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipSync-macos-universal
          path: desktop/macos/ClipSync-macos-universal.dmg

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK & NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release --manifest-path core/Cargo.toml
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Package Android artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk ClipSync-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClipSync-android
          path: ClipSync-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ClipSync-windows-x64.exe
            artifacts/ClipSync-macos-universal.dmg
            artifacts/ClipSync-android.apk
