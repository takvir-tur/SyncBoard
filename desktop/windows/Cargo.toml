[package]
name = "clipsync_windows"
version = "0.1.0"
edition = "2021"
description = "Lightweight Windows system-tray shared clipboard client"

[[bin]]
name = "clipsync"
path = "src/main.rs"

[dependencies]
clipsync_core = { path = "../../core" }
tray-icon = "0.19"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
